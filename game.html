<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Quintessence</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050608;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      #dev {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.75);
        color: #9fe39f;
        font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
      }
      #fatal {
        color: #ff8080;
        font: 14px system-ui, sans-serif;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="dev" hidden></pre>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
